[package]
name = "fastga-rs"
version = "0.1.2"
edition = "2021"
authors = ["Erik Garrison <erik.garrison@gmail.com>"]
license = "MIT"
description = "Rust bindings for FastGA genome aligner with extended CIGAR support"
repository = "https://github.com/pangenome/fastga-rs"
keywords = ["genomics", "alignment", "bioinformatics", "fastga"]
categories = ["science", "api-bindings"]
exclude = [
    "target/",
    "data/",
    "deps/fastga/EXAMPLE/",
    "*.md",
    "!README.md",
    "!LICENSE",
]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3.8"
libc = "0.2"
num_cpus = "1.16"
nix = { version = "0.27", features = ["fs", "process"] }
onecode = { git = "https://github.com/pangenome/onecode-rs", rev = "5fa1e9333f18b311580f1346751c630c626d8342" }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[dev-dependencies]
pretty_assertions = "1.4"
